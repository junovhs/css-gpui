[package]
name = "css-gpui-carousel"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
css-gpui = { path = "../../.." }
fontdue = "=0.9.4"
gpui = { version = "=0.2.2", default-features = false, features = ["x11"] }
image = { version = "=0.25.10", default-features = false }
serde_json = "1.0"

[build-dependencies]
css-gpui = { path = "../../.." }
serde_json = "1.0"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.css-gpui-carousel]
opt-level = 2

[profile.dev.package.fontdue]
opt-level = 2
