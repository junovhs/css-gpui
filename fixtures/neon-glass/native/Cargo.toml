[package]
name = "css-gpui-neon-reference"
version = "0.1.0"
edition = "2024"
publish = false

[features]
interactive = []

[[example]]
name = "menu"
required-features = ["interactive"]

[dependencies]
css-gpui = { path = "../../.." }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
serde_json = "1.0"

gpui = { version = "=0.2.2", default-features = false, features = ["test-support", "windows-manifest"] }

[build-dependencies]
css-gpui = { path = "../../.." }
serde_json = "1.0"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.css-gpui]
opt-level = 2

[profile.dev.package.css-gpui-neon-reference]
opt-level = 2
